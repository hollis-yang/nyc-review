name: nyc-review-p14-load

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: p14-load-only
      MYSQL_DATABASE: nyc_review_p14_load
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --performance-schema=ON
    ports:
      - "13306:3306"
    volumes:
      - p14-mysql:/var/lib/mysql
      - ./src/main/resources/db/nyc_review.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./src/main/resources/db/p2_redis_stream_order.sql:/docker-entrypoint-initdb.d/02-order-unique-index.sql:ro
      - ./src/main/resources/db/p3_nyc_compatibility.sql:/docker-entrypoint-initdb.d/03-nyc-compatibility.sql:ro
      - ./src/main/resources/db/p4_nyc_domain.sql:/docker-entrypoint-initdb.d/04-nyc-domain.sql:ro
      - ./src/main/resources/db/p5_agent_actions.sql:/docker-entrypoint-initdb.d/05-agent-actions.sql:ro
      - ./src/main/resources/db/p6_rabbitmq_profile_memory.sql:/docker-entrypoint-initdb.d/06-agent-memory.sql:ro
      - ./src/main/resources/db/p7_p5_mcp_ui.sql:/docker-entrypoint-initdb.d/07-p5-ui.sql:ro
      - ./src/main/resources/db/p8_p6_data_provenance.sql:/docker-entrypoint-initdb.d/08-p6-provenance.sql:ro
      - ./src/main/resources/db/p9_p7_map_geospatial.sql:/docker-entrypoint-initdb.d/09-p7-map-schema.sql:ro
      - ./src/main/resources/db/p10_p8_real_content.sql:/docker-entrypoint-initdb.d/10-p8-real-content.sql:ro
      - ./src/main/resources/db/p11_p2_p3_shop_enrichment.sql:/docker-entrypoint-initdb.d/11-shop-enrichment.sql:ro
      - ./src/main/resources/db/p12_p13_data_quality.sql:/docker-entrypoint-initdb.d/12-data-quality.sql:ro
      - ./data/generated/nyc-real-p13-full/mysql_import.sql:/docker-entrypoint-initdb.d/13-p13-data.sql:ro
      - ./data/generated/nyc-real-p13-full/p7_neighborhood_import.sql:/docker-entrypoint-initdb.d/14-map-data.sql:ro
      - ./src/main/resources/db/cleanup_nyc_review_legacy.sql:/docker-entrypoint-initdb.d/15-cleanup.sql:ro
      - ./src/main/resources/db/auth_password_registration.sql:/docker-entrypoint-initdb.d/16-password-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pp14-load-only --silent"]
      interval: 5s
      timeout: 5s
      retries: 120

  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    volumes:
      - p14-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-seed:
    image: redis:7.4-alpine
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/generated/nyc-real-p13-full/redis_seed.resp:/seed/redis_seed.resp:ro
    command: ["sh", "-c", "redis-cli -h redis --pipe < /seed/redis_seed.resp && redis-cli -h redis SET nyc-review:p14:environment isolated-load-only"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: p14-load
      RABBITMQ_DEFAULT_PASS: p14-load-only
      RABBITMQ_DEFAULT_VHOST: /nyc-review-p14-load
    ports:
      - "15673:5672"
      - "15683:15672"
    volumes:
      - p14-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  spring:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: p14-load
      NYC_REVIEW_DB_URL: jdbc:mysql://mysql:3306/nyc_review_p14_load?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      NYC_REVIEW_DB_USERNAME: root
      NYC_REVIEW_DB_PASSWORD: p14-load-only
      NYC_REVIEW_REDIS_HOST: redis
      NYC_REVIEW_REDIS_PORT: 6379
      NYC_REVIEW_RABBITMQ_HOST: rabbitmq
      NYC_REVIEW_RABBITMQ_PORT: 5672
      NYC_REVIEW_RABBITMQ_USERNAME: p14-load
      NYC_REVIEW_RABBITMQ_PASSWORD: p14-load-only
      NYC_REVIEW_RABBITMQ_VHOST: /nyc-review-p14-load
      NYC_REVIEW_LOAD_DB_POOL_SIZE: ${NYC_REVIEW_LOAD_DB_POOL_SIZE:-10}
      NYC_REVIEW_LOAD_REDIS_MAX_ACTIVE: ${NYC_REVIEW_LOAD_REDIS_MAX_ACTIVE:-10}
      NYC_REVIEW_LOAD_RABBIT_CONCURRENCY: ${NYC_REVIEW_LOAD_RABBIT_CONCURRENCY:-1}
      NYC_REVIEW_LOAD_RABBIT_MAX_CONCURRENCY: ${NYC_REVIEW_LOAD_RABBIT_MAX_CONCURRENCY:-1}
      NYC_REVIEW_LOAD_RABBIT_PREFETCH: ${NYC_REVIEW_LOAD_RABBIT_PREFETCH:-16}
      NYC_REVIEW_RABBITMQ_REPLAY_INTERVAL_MS: 1000
      DEEPSEEK_API_KEY: disabled-in-p14-load
      DEEPSEEK_MODEL: deepseek-chat
      NYC_REVIEW_IMAGE_UPLOAD_DIR: /tmp/p14-load-uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "18081:8081"
      - "19091:9091"
  agent-service:
    build:
      context: ./agent-service
    environment:
      NYC_REVIEW_AGENT_ADAPTER: http
      NYC_REVIEW_AGENT_BACKEND_BASE_URL: http://spring:8081
      NYC_REVIEW_AGENT_BACKEND_AUTH_TOKEN: p14-load-000001
      NYC_REVIEW_AGENT_RAG_ADAPTER: memory
      NYC_REVIEW_AGENT_RAG_DATA_DIRECTORY: /rag
      NYC_REVIEW_AGENT_MODEL_PROVIDER: heuristic
      NYC_REVIEW_AGENT_RUNS_PER_MINUTE: 120
      NYC_REVIEW_AGENT_RUN_STORE_PATH: /data/agent-runs.sqlite3
      NYC_REVIEW_AGENT_MCP_ENABLED: "false"
    depends_on:
      spring:
        condition: service_started
    ports:
      - "18090:8090"
    volumes:
      - p14-agent-runs:/data
      - ./data/generated/nyc-real-p13-full:/rag:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./scripts/p14_1/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - p14-prometheus:/prometheus
    ports:
      - "19090:9090"
    depends_on:
      spring:
        condition: service_started

  k6:
    image: grafana/k6:0.57.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./scripts/p14_1/k6:/workspace/scripts:ro
      - ./reports/p14-1:/workspace/reports

volumes:
  p14-mysql:
  p14-redis:
  p14-rabbitmq:
  p14-agent-runs:
  p14-prometheus:
