server:
  shutdown: graceful
  tomcat:
    threads:
      max: 80
      min-spare: 5
    accept-count: 100
    connection-timeout: 5s

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2s
  rabbitmq:
    virtual-host: ${NYC_REVIEW_RABBITMQ_VHOST}
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 16

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.nycreview: INFO
