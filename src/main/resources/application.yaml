server:
  port: 8081
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HMDP_DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp_new?useSSL=false&serverTimezone=UTC}
    username: ${HMDP_DB_USERNAME:root}
    password: ${HMDP_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${HMDP_REDIS_HOST:localhost}
      port: ${HMDP_REDIS_PORT:6379}
      database: ${HMDP_REDIS_DATABASE:0}
      username: ${HMDP_REDIS_USERNAME:}
      password: ${HMDP_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${HMDP_RABBITMQ_HOST:localhost}
    port: ${HMDP_RABBITMQ_PORT:5672}
    username: ${HMDP_RABBITMQ_USERNAME:guest}
    password: ${HMDP_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 16
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
hmdp:
  upload:
    image-dir: ${HMDP_IMAGE_UPLOAD_DIR:./uploads/imgs}
  rabbitmq:
    confirm-timeout: ${HMDP_RABBITMQ_CONFIRM_TIMEOUT:5s}
    replay-interval-ms: ${HMDP_RABBITMQ_REPLAY_INTERVAL_MS:5000}
    replay-batch-size: ${HMDP_RABBITMQ_REPLAY_BATCH_SIZE:50}
