services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${HMDP_DB_PASSWORD:-hmdp-local}
      MYSQL_DATABASE: hmdp_new
      TZ: America/New_York
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    ports:
      - "3306:3306"
    volumes:
      - hmdp-mysql:/var/lib/mysql
      - ./src/main/resources/db/hmdp_new.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./src/main/resources/db/p2_redis_stream_order.sql:/docker-entrypoint-initdb.d/02-order-unique-index.sql:ro
      - ./src/main/resources/db/p3_nyc_compatibility.sql:/docker-entrypoint-initdb.d/03-nyc-compatibility.sql:ro
      - ./src/main/resources/db/p4_nyc_domain.sql:/docker-entrypoint-initdb.d/04-nyc-domain.sql:ro
      - ./src/main/resources/db/p5_agent_actions.sql:/docker-entrypoint-initdb.d/05-agent-actions.sql:ro
      - ./src/main/resources/db/p6_rabbitmq_profile_memory.sql:/docker-entrypoint-initdb.d/06-agent-memory.sql:ro
      - ./src/main/resources/db/p7_p5_mcp_ui.sql:/docker-entrypoint-initdb.d/07-p5-ui.sql:ro
      - ./data/generated/nyc-small/mysql_import.sql:/docker-entrypoint-initdb.d/08-nyc-mock.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - hmdp-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-seed:
    image: redis:7.4-alpine
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/generated/nyc-small/redis_seed.resp:/seed/redis_seed.resp:ro
    command: ["sh", "-c", "redis-cli -h redis --pipe < /seed/redis_seed.resp"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${HMDP_RABBITMQ_USERNAME:-hmdp}
      RABBITMQ_DEFAULT_PASS: ${HMDP_RABBITMQ_PASSWORD:-hmdp-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - hmdp-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.15.3
    ports:
      - "6333:6333"
    volumes:
      - hmdp-qdrant:/qdrant/storage

  spring:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HMDP_DB_URL: "jdbc:mysql://mysql:3306/hmdp_new?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      HMDP_DB_USERNAME: root
      HMDP_DB_PASSWORD: ${HMDP_DB_PASSWORD:-hmdp-local}
      HMDP_REDIS_HOST: redis
      HMDP_REDIS_PORT: 6379
      HMDP_RABBITMQ_HOST: rabbitmq
      HMDP_RABBITMQ_PORT: 5672
      HMDP_RABBITMQ_USERNAME: ${HMDP_RABBITMQ_USERNAME:-hmdp}
      HMDP_RABBITMQ_PASSWORD: ${HMDP_RABBITMQ_PASSWORD:-hmdp-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      HMDP_IMAGE_UPLOAD_DIR: /data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - hmdp-uploads:/data/uploads

  agent-service:
    build:
      context: ./agent-service
    environment:
      HMDP_AGENT_ADAPTER: http
      HMDP_AGENT_BACKEND_BASE_URL: http://spring:8081
      HMDP_AGENT_RAG_ADAPTER: qdrant
      HMDP_AGENT_QDRANT_LOCATION: http://qdrant:6333
      HMDP_AGENT_RAG_DATA_DIRECTORY: /data/nyc-small
      HMDP_AGENT_MODEL_PROVIDER: ${HMDP_AGENT_MODEL_PROVIDER:-deepseek}
      HMDP_AGENT_MODEL_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      HMDP_AGENT_RUN_STORE_PATH: /data/runs/agent-runs.sqlite3
      HMDP_AGENT_METRICS_TOKEN: ${HMDP_AGENT_METRICS_TOKEN:-}
      HMDP_AGENT_MCP_API_KEY: ${HMDP_AGENT_MCP_API_KEY:-}
    depends_on:
      - spring
      - qdrant
    ports:
      - "8090:8090"
    volumes:
      - ./data/generated/nyc-small:/data/nyc-small:ro
      - hmdp-agent-runs:/data/runs

  web:
    build:
      context: ./hmdp-react
    depends_on:
      - spring
      - agent-service
    ports:
      - "8080:80"

volumes:
  hmdp-mysql:
  hmdp-redis:
  hmdp-rabbitmq:
  hmdp-qdrant:
  hmdp-uploads:
  hmdp-agent-runs:
